openapi: 3.1.0
info:
  title: PitchMind Canonical Match BFF
  version: 1.0.0
  description: >-
    PostgreSQL-backed, selected-time read contracts. These routes are separate from
    the fixture-backed demo API. Azure runtime profiles require an Entra authority,
    audience, signature and lifetime validation. Roles are fan, analyst and admin.
servers:
  - url: /
security:
  - entraBearer: []
paths:
  /api/v1/canonical/fixtures:
    get:
      operationId: listCanonicalFixtures
      parameters:
        - name: afterMatchId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Latest persisted match projections.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalMatchPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/canonical/matches/{matchId}/summary:
    get:
      operationId: getCanonicalMatchSummary
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/AtSeconds'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Persisted state projection at the selected time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalMatchSnapshot' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/canonical/matches/{matchId}/events:
    get:
      operationId: listCanonicalMatchEvents
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/AtSeconds'
        - $ref: '#/components/parameters/Revision'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sequence-ordered canonical event page bounded by selected time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalEventPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/canonical/matches/{matchId}/frames:
    get:
      operationId: listCanonicalTrackingFrames
      x-required-roles: [analyst, admin]
      summary: Read persisted tracking frames at the exact selected match second.
      description: >-
        Frames are bounded by the selected projection sequence, canonical admission revision,
        and immutable source hash. Pages use stable (sequence, frameId) keyset ordering. The
        cursor binds match, selected time, both revision axes, and source hash. No positions
        are interpolated or fabricated by this endpoint.
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/AtSeconds'
        - $ref: '#/components/parameters/Revision'
        - $ref: '#/components/parameters/Cursor'
        - name: frameId
          in: query
          description: Exact frame identity lookup at the selected match time and revisions; 1–128 non-whitespace characters; cannot be combined with cursor.
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 25, default: 12 }
      responses:
        '200':
          description: Persisted tracking-frame page for the selected source and projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalTrackingFramePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/canonical/matches/{matchId}/timeline/backfill:
    get:
      operationId: backfillCanonicalTimeline
      summary: Refresh one canonical snapshot and catch up from the client's last sequence.
      description: >-
        Reads only the durable PostgreSQL event ledger and projection. The response
        binds snapshot and events to one selected time and projection revision. If
        the client's projection revision changed, its sequence is ahead of the durable head,
        or it resumes with a sequence but no revision, replayRequired is true and events restart
        from sequence -1. A cursor message
        is only a wake-up; clients use this endpoint to recover canonical facts.
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - name: afterSequence
          in: query
          required: true
          description: Last applied zero-based event sequence; use -1 for an initial replay.
          schema: { type: integer, minimum: -1 }
        - name: atSeconds
          in: query
          description: Selected match time, defaults to the match head bound (5400 seconds).
          schema: { type: integer, minimum: 0, maximum: 5400, default: 5400 }
        - name: revision
          in: query
          description: Client's prior projectionRevision; a mismatch forces replay. This is distinct from canonicalRevision.
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Durable selected-time snapshot and bounded ordered catch-up page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalTimelineBackfill' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/canonical/matches/{matchId}/insights:
    get:
      operationId: listCanonicalMatchInsights
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/AtSeconds'
        - $ref: '#/components/parameters/Revision'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Persisted insights with resolvable selected-time evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalInsightPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/canonical/matches/{matchId}/insights/{insightId}:
    get:
      operationId: getCanonicalMatchInsight
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - name: insightId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: '#/components/parameters/AtSeconds'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: One persisted insight with resolvable selected-time evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalInsight' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/canonical/matches/{matchId}/evidence/{insightId}:
    get:
      operationId: getCanonicalInsightEvidence
      x-required-roles: [analyst, admin]
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - name: insightId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: '#/components/parameters/AtSeconds'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Persisted insight with complete event/frame evidence visible at the selected time and sequence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalEvidence' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/canonical/matches/{matchId}/replay:
    get:
      operationId: getCanonicalReplayPage
      x-required-roles: [analyst, admin]
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/AtSeconds'
        - $ref: '#/components/parameters/Revision'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Point-in-time persisted snapshot and event page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalReplay' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/canonical/matches/{matchId}/key-moments:
    get:
      operationId: listCanonicalKeyMoments
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/AtSeconds'
        - $ref: '#/components/parameters/Revision'
      responses:
        '400': { $ref: '#/components/responses/Problem' }
        '503':
          description: No persisted canonical key-moment projection exists; demo moments are not substituted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/realtime/negotiate:
    post:
      operationId: negotiateMatchRealtime
      summary: Negotiate an authorized match-scoped live cursor subscription.
      description: >-
        Returns only the committed canonical revision and sequence cursor. It does not return
        score, events, tracking, or any other canonical football fact. The local ASP.NET Core
        SignalR adapter is available only in Development with the local runtime/provider profile.
        A connection can hold at most 10 active match groups and make at most 20 unique
        subscription attempts during its lifetime. Repeating an active subscription is idempotent.
      x-required-roles: [fan, analyst, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [matchId]
              properties:
                matchId: { type: string, format: uuid }
                clientRevision: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Local SignalR transport details and canonical head cursor.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [transport, url, accessToken, cursor, revisionChanged]
                properties:
                  transport: { type: string, const: aspnetcore-signalr }
                  url: { type: string, const: /hubs/matches }
                  accessToken: { type: [string, 'null'] }
                  revisionChanged: { type: boolean }
                  cursor:
                    type: object
                    additionalProperties: false
                    required: [kind, matchId, canonicalRevision, lastSequence, serverUtc, schemaVersion]
                    properties:
                      kind: { type: string, const: matchUpdated }
                      matchId: { type: string, format: uuid }
                      canonicalRevision: { type: integer, format: int64, minimum: 1 }
                      lastSequence: { type: integer, format: int64, minimum: 0 }
                      serverUtc: { type: string, format: date-time }
                      schemaVersion: { type: integer, const: 1 }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    entraBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MatchId:
      name: matchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AtSeconds:
      name: atSeconds
      in: query
      schema: { type: integer, minimum: 0, maximum: 5400, default: 0 }
    Revision:
      name: revision
      in: query
      description: Maximum projectionRevision for the selected-time read. This is distinct from the canonicalRevision admission sequence returned in responses.
      schema: { type: integer, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Problem:
      description: Typed, sanitized API failure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblem' }
  schemas:
    ApiProblem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        correlationId: { type: string }
        detail: { type: [string, 'null'] }
        instance: { type: [string, 'null'] }
    PlayerState:
      type: object
      required: [playerId, teamId, active, dismissed, yellowCards]
      properties:
        playerId: { type: string }
        teamId: { type: string }
        active: { type: boolean }
        dismissed: { type: boolean }
        yellowCards: { type: integer, minimum: 0 }
    CanonicalMatchCard:
      type: object
      required: [matchId, canonicalRevision, projectionRevision, asOfSeconds, throughSequence, phase, homeScore, awayScore, provenance, algorithmVersion, sourceSha256]
      properties:
        matchId: { type: string, format: uuid }
        canonicalRevision: { type: integer }
        projectionRevision: { type: integer, minimum: 1 }
        asOfSeconds: { type: integer }
        throughSequence: { type: integer }
        phase: { type: string }
        homeScore: { type: integer, minimum: 0 }
        awayScore: { type: integer, minimum: 0 }
        provenance: { type: string }
        algorithmVersion: { type: string }
        sourceSha256: { type: string }
    CanonicalMatchPage:
      type: object
      required: [items, nextMatchId, hasMore]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CanonicalMatchCard' } }
        nextMatchId: { type: [string, 'null'], format: uuid }
        hasMore: { type: boolean }
    CanonicalMatchSnapshot:
      type: object
      required: [matchId, canonicalRevision, projectionRevision, selectedTimeSeconds, asOfSeconds, throughSequence, algorithmVersion, sourceSha256, stateSha256, provenance, period, phase, homeScore, awayScore, possessionTeamId, homeActivePlayers, awayActivePlayers, players]
      properties:
        matchId: { type: string, format: uuid }
        canonicalRevision: { type: integer }
        projectionRevision: { type: integer, minimum: 1 }
        selectedTimeSeconds: { type: integer }
        asOfSeconds: { type: integer }
        throughSequence: { type: integer }
        algorithmVersion: { type: string }
        sourceSha256: { type: string }
        stateSha256: { type: string }
        provenance: { type: string }
        period: { type: integer }
        phase: { type: string }
        homeScore: { type: integer, minimum: 0 }
        awayScore: { type: integer, minimum: 0 }
        possessionTeamId: { type: [string, 'null'] }
        homeActivePlayers: { type: integer, minimum: 0 }
        awayActivePlayers: { type: integer, minimum: 0 }
        players: { type: array, items: { $ref: '#/components/schemas/PlayerState' } }
    CanonicalEvent:
      type: object
      required: [eventId, matchId, sequence, type, clockSeconds, period, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        matchId: { type: string, format: uuid }
        sequence: { type: integer }
        type: { type: string }
        clockSeconds: { type: integer }
        period: { type: integer }
        occurredAt: { type: string, format: date-time }
    CanonicalEventPage:
      type: object
      required: [matchId, canonicalRevision, projectionRevision, selectedTimeSeconds, throughSequence, items, nextCursor, hasMore]
      properties:
        matchId: { type: string, format: uuid }
        canonicalRevision: { type: integer }
        projectionRevision: { type: integer, minimum: 1 }
        selectedTimeSeconds: { type: integer }
        throughSequence: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/CanonicalEvent' } }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    CanonicalTrackingFrame:
      type: object
      required: [frameId, sequence, canonicalRevision, projectionRevision, period, clockSeconds, coordinateVersion, quality, sourceSha256, frame]
      properties:
        frameId: { type: string, minLength: 1, maxLength: 128 }
        sequence: { type: integer, format: int64, minimum: 0 }
        canonicalRevision: { type: integer, format: int64, minimum: 1 }
        projectionRevision: { type: integer, minimum: 1 }
        period: { type: integer, minimum: 1 }
        clockSeconds: { type: integer, minimum: 0, maximum: 5400 }
        coordinateVersion: { type: string }
        quality: { type: object, additionalProperties: true }
        sourceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        frame: { $ref: '#/components/schemas/TrackingFrameV1' }
    TrackingFrameV1:
      type: object
      required: [schemaVersion, matchId, canonicalRevision, frameId, sequence, matchTime, coordinateSystem, ball, players, source]
      properties:
        schemaVersion: { type: integer, const: 1 }
        matchId: { type: string, format: uuid }
        canonicalRevision: { type: integer, format: int64, minimum: 1 }
        frameId: { type: string, minLength: 1, maxLength: 128 }
        sequence: { type: integer, format: int64, minimum: 0 }
        matchTime:
          type: object
          required: [period, elapsedSeconds, sourceClockValue, sourceClockUnit, sourceClockBasis]
          properties:
            period: { type: integer, minimum: 1, maximum: 5 }
            elapsedSeconds: { type: integer, format: int64, minimum: 0 }
            sourceClockValue: { type: number }
            sourceClockUnit: { type: string }
            sourceClockBasis: { type: string }
        coordinateSystem:
          type: object
          required: [lengthMetres, widthMetres, unit, axisOrigin, teamDirections]
          properties:
            lengthMetres: { type: number, exclusiveMinimum: 0 }
            widthMetres: { type: number, exclusiveMinimum: 0 }
            unit: { type: string, enum: [metres, normalized_0_1, percent_0_100] }
            axisOrigin: { type: string, enum: [bottom_left, top_left] }
            teamDirections:
              type: array
              items:
                type: object
                required: [teamId, direction]
                properties:
                  teamId: { type: string }
                  direction: { type: string, enum: [left, right] }
        ball:
          type: object
          required: [x, y]
          properties:
            x: { type: number }
            y: { type: number }
        players:
          type: array
          items:
            type: object
            required: [playerId, teamId, position]
            properties:
              playerId: { type: string }
              teamId: { type: string }
              position:
                type: object
                required: [x, y]
                properties:
                  x: { type: number }
                  y: { type: number }
        source:
          type: object
          required: [providerId, sourceMatchId, sourceRecordId, sourceSequence, sourceSchemaVersion, sourceSha256, provenanceStatus, rightsReviewStatus]
          properties:
            providerId: { type: string }
            sourceMatchId: { type: string }
            sourceRecordId: { type: string }
            sourceSequence: { type: integer, format: int64 }
            sourceSchemaVersion: { type: string }
            sourceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            sourceTimestampUtc: { type: [string, 'null'], format: date-time }
            provenanceStatus: { type: string }
            rightsReviewStatus: { type: string }
    CanonicalTrackingFramePage:
      type: object
      required: [matchId, canonicalRevision, projectionRevision, selectedTimeSeconds, throughSequence, items, nextCursor, hasMore]
      properties:
        matchId: { type: string, format: uuid }
        canonicalRevision: { type: integer, format: int64, minimum: 1 }
        projectionRevision: { type: integer, minimum: 1 }
        selectedTimeSeconds: { type: integer, minimum: 0, maximum: 5400 }
        throughSequence: { type: integer, format: int64, minimum: -1 }
        items: { type: array, maxItems: 25, items: { $ref: '#/components/schemas/CanonicalTrackingFrame' } }
        nextCursor: { type: [string, 'null'], maxLength: 2048 }
        hasMore: { type: boolean }
    CanonicalTimelineBackfill:
      type: object
      required: [snapshot, events, revisionChanged, replayRequired, requestedAfterSequence]
      properties:
        snapshot: { $ref: '#/components/schemas/CanonicalMatchSnapshot' }
        events: { $ref: '#/components/schemas/CanonicalEventPage' }
        revisionChanged: { type: boolean }
        replayRequired: { type: boolean }
        requestedAfterSequence: { type: integer, minimum: -1 }
    CanonicalEvidenceReference:
      type: object
      required: [kind, id, relation]
      properties:
        kind: { type: string }
        id: { type: string }
        relation: { type: string }
    CanonicalInsight:
      type: object
      required: [insightId, matchId, canonicalRevision, projectionRevision, selectedTimeSeconds, throughSequence, sourceVersion, provenance, sourceSha256, detectorVersion, truthClass, summary, evidence]
      properties:
        insightId: { type: string }
        matchId: { type: string, format: uuid }
        canonicalRevision: { type: integer }
        projectionRevision: { type: integer, minimum: 1 }
        selectedTimeSeconds: { type: integer }
        throughSequence: { type: integer }
        sourceVersion: { type: string }
        provenance: { type: string }
        sourceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        detectorVersion: { type: string }
        truthClass: { type: string }
        summary: { type: string }
        evidence: { type: array, items: { $ref: '#/components/schemas/CanonicalEvidenceReference' } }
    CanonicalInsightPage:
      type: object
      required: [matchId, canonicalRevision, projectionRevision, selectedTimeSeconds, throughSequence, items, nextCursor, hasMore]
      properties:
        matchId: { type: string, format: uuid }
        canonicalRevision: { type: integer }
        projectionRevision: { type: integer, minimum: 1 }
        selectedTimeSeconds: { type: integer }
        throughSequence: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/CanonicalInsight' } }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    CanonicalEvidencePayload:
      type: object
      required: [kind, id, relation, sourceCanonicalRevision, sequence, clockSeconds, period, payload]
      properties:
        kind: { type: string, enum: [event, frame] }
        id: { type: string }
        relation: { type: string }
        sourceCanonicalRevision: { type: integer, minimum: 1 }
        sequence: { type: integer }
        clockSeconds: { type: integer }
        period: { type: integer }
        payload: { type: object, additionalProperties: true }
    CanonicalEvidence:
      type: object
      required: [insight, items]
      properties:
        insight: { $ref: '#/components/schemas/CanonicalInsight' }
        items: { type: array, items: { $ref: '#/components/schemas/CanonicalEvidencePayload' } }
    CanonicalReplay:
      type: object
      required: [snapshot, events]
      properties:
        snapshot: { $ref: '#/components/schemas/CanonicalMatchSnapshot' }
        events: { $ref: '#/components/schemas/CanonicalEventPage' }
