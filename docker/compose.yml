name: pitchmind

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitchmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-pitchmind}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitchmind} -d ${POSTGRES_DB:-pitchmind}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks: [local]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in docker/.env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks: [local]

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [local]

volumes:
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME:-pitchmind_postgres_data}
  redis-data:
    name: ${REDIS_DATA_VOLUME:-pitchmind_redis_data}
  kafka-data:
    name: ${KAFKA_DATA_VOLUME:-pitchmind_kafka_data}

networks:
  local:
    driver: bridge
