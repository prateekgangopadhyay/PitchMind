# Azure DevOps is the only CI/CD orchestrator. DEV delivery activates after service-connection configuration.
parameters:
- name: enableDevDelivery
  type: boolean
  default: false
- name: acrPushServiceConnection
  type: string
  default: unconfigured
- name: devDeploymentServiceConnection
  type: string
  default: unconfigured
- name: registryName
  type: string
  default: pmdev4iwntkatliy6sacr
- name: devResourceGroup
  type: string
  default: rg-pitchmind-dev-001
- name: devAppName
  type: string
  default: pm-dev-api
trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Validate
  displayName: M02 quality gates
  jobs:
  - job: Repository
    displayName: Repository and security baseline
    steps:
    - checkout: self
    - bash: |
        set -euo pipefail
        test -f docs/architecture/01-system-context.md
        test -f docs/architecture/02-container.md
        test -f docs/architecture/03-components.md
        test -f docs/backlog/MVP-BACKLOG.md
        test ! -d .github/workflows
        test ! -f docker/.env
        test -f docker/.env.example
        docker compose --env-file docker/.env.example -f docker/compose.yml config --quiet
      displayName: Validate repository and Compose configuration
    - bash: |
        set -euo pipefail
        python3 -m unittest discover -s scripts -p 'test_profile_simulation_feed.py' -v
        test -f docs/backlog/STORY-WORKPACK-INDEX.md
        test -f docs/architecture/06-target-azure-hld.md
        test -f docs/architecture/07-football-analytics-detailed-lld.md
      displayName: Verify source-feed preflight and planning artifacts
    - bash: |
        set -euo pipefail
        node scripts/validate_operating_model.mjs
        node scripts/validate_operating_model.mjs --self-test
      displayName: Verify story routing and DEV release gate structure
  - job: Backend
    displayName: .NET 10 build and tests
    steps:
    - checkout: self
    - template: templates/validate-dotnet.yml
  - job: Frontend
    displayName: React build, test and lint
    steps:
    - checkout: self
    - template: templates/validate-frontend.yml
  - job: LocalInfrastructure
    displayName: PostgreSQL and Redis smoke tests
    steps:
    - checkout: self
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 10.0.x
    - bash: |
        set -euo pipefail
        chmod +x scripts/dev-*.sh
        trap './scripts/dev-down.sh' EXIT
        ./scripts/dev-up.sh
        ./scripts/dev-health.sh
        PITCHMIND_TEST_RESULTS_DIRECTORY="$(Agent.TempDirectory)/pitchmind-postgres-results" ./scripts/test-postgres.sh
      displayName: Docker Compose health and real PostgreSQL integration
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: $(Agent.TempDirectory)/pitchmind-postgres-results/postgres.trx
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
  - job: Infrastructure
    displayName: Azure Bicep static compilation
    steps:
    - checkout: self
    - template: templates/validate-infra.yml

# Only a deliberately queued parameterized run may reach these stages. The default
# validation-only main/PR pipeline CANNOT deploy. Owner approval for the exact story,
# scope, resource diff, costs, SHA and rollback is mandatory BEFORE ACR push/DEV write.
# Dedicated Azure DevOps Environments are approval hooks; their required checks,
# approver lists and permissions are external configuration and must be independently
# verified before this delivery path is enabled. ManualValidation below is an extra
# pause only; it does NOT establish approver identity.
- ${{ if eq(parameters.enableDevDelivery, true) }}:
  - stage: OwnerApprovalBeforeAzureMutation
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
    - job: ValidateReleaseIdentityInputs
      pool:
        vmImage: ubuntu-latest
      steps:
      - checkout: self
      - task: Bash@3
        displayName: Require separate image-push and DEV-deployment identities
        inputs:
          targetType: inline
          script: python3 scripts/validate_release_identity_inputs.py
        env:
          PITCHMIND_ACR_PUSH_SERVICE_CONNECTION: ${{ parameters.acrPushServiceConnection }}
          PITCHMIND_DEV_DEPLOY_SERVICE_CONNECTION: ${{ parameters.devDeploymentServiceConnection }}
    - deployment: AwaitExplicitOwnerApproval
      dependsOn: ValidateReleaseIdentityInputs
      displayName: Review the approved change set before ACR push or DEV mutation
      environment: pitchmind-release-authorization
      strategy:
        runOnce:
          deploy:
            steps:
            - bash: |
                echo 'Protected environment approval completed; no Azure mutation occurs in this stage.'
              displayName: Record pre-mutation authorization gate
    - job: AwaitOwnerConsentRecord
      dependsOn: AwaitExplicitOwnerApproval
      displayName: Pause until exact change-set approval is recorded
      pool: server
      timeoutInMinutes: 1440
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 1440
        inputs:
          notifyUsers: ''
          instructions: |
            This pause does not establish approver identity. Resume only after repository-owner
            consent for this exact SHA, change scope, resource diff, cost estimate and rollback
            has been recorded and the protected Environment approval has completed. Otherwise reject.
          onTimeout: reject
  - stage: BuildRelease
    dependsOn: OwnerApprovalBeforeAzureMutation
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
    - job: Image
      steps:
      - checkout: self
      - template: templates/build-image.yml
        parameters:
          acrPushServiceConnection: ${{ parameters.acrPushServiceConnection }}
          registryName: ${{ parameters.registryName }}
  - stage: OwnerApprovalOfReleaseDigest
    dependsOn: BuildRelease
    condition: succeeded()
    jobs:
    - deployment: AwaitDigestConfirmation
      displayName: Owner reconfirms the immutable image and DEV deployment
      environment: pitchmind-release-digest-authorization
      strategy:
        runOnce:
          deploy:
            steps:
            - bash: |
                echo 'Protected environment approval completed; digest and DEV change must match the approved release manifest.'
              displayName: Record immutable digest authorization gate
    - job: AwaitDigestConsentRecord
      dependsOn: AwaitDigestConfirmation
      displayName: Pause until immutable digest approval is recorded
      pool: server
      timeoutInMinutes: 1440
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 1440
        inputs:
          notifyUsers: ''
          instructions: |
            This pause does not establish approver identity. Resume only after repository-owner
            consent for the exact immutable image digest and DEV impact has been recorded and the
            protected digest Environment approval has completed. Otherwise reject.
          onTimeout: reject
  - stage: DeployDev
    dependsOn: OwnerApprovalOfReleaseDigest
    condition: succeeded()
    jobs:
    - deployment: Dev
      environment: pitchmind-dev
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
            - template: templates/deploy-image.yml
              parameters:
                devDeploymentServiceConnection: ${{ parameters.devDeploymentServiceConnection }}
                resourceGroup: ${{ parameters.devResourceGroup }}
                appName: ${{ parameters.devAppName }}
