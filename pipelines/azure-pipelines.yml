# Azure DevOps is the only CI/CD orchestrator. DEV changes remain behind the guarded release stages.
parameters:
- name: runGateFailureProbe
  type: boolean
  default: false
- name: enableDevDelivery
  type: boolean
  default: true
- name: acrPushServiceConnection
  type: string
  default: pitchmind-acr-publisher-wif
- name: devDeploymentServiceConnection
  type: string
  default: pitchmind-dev-deployer-wif
- name: devInfrastructureServiceConnection
  type: string
  default: pitchmind-dev-infrastructure-wif
- name: registryName
  type: string
  default: pmdev4iwntkatliy6sacr
- name: devResourceGroup
  type: string
  default: rg-pitchmind-dev-001
- name: devAppName
  type: string
  default: pm-dev-api-vnet
- name: devVnetName
  type: string
  default: pm-dev-vnet
- name: devAcaSubnetName
  type: string
  default: container-apps
- name: devAcaSubnetCidr
  type: string
  default: 10.42.0.0/27
- name: devPostgresSubnetName
  type: string
  default: postgres
- name: devPostgresSubnetCidr
  type: string
  default: 10.42.1.0/24
- name: devPostgresDnsZoneName
  type: string
  default: pm-dev-private.postgres.database.azure.com
- name: devEnvironmentName
  type: string
  default: pm-dev-private-cae
- name: provisionPostgres
  type: boolean
  default: false
- name: devPostgresServerName
  type: string
  default: pitchmind-postgresql-dev
- name: devPostgresSkuTier
  type: string
  default: Burstable
- name: devPostgresSkuName
  type: string
  default: ''
- name: devPostgresAdminObjectId
  type: string
  default: ''
- name: devPostgresAdminPrincipalName
  type: string
  default: ''
- name: devPostgresAdminPrincipalType
  type: string
  default: User
- name: devEstimatedMonthlyCost
  type: string
  default: '$15'
- name: provisionRedis
  type: boolean
  default: false
- name: enableCandidateFeed
  type: boolean
  default: true
- name: devSignalRName
  type: string
  default: pm-dev-signalr
- name: devPublicAppOrigin
  type: string
  default: https://pm-dev-api-vnet.icyglacier-6b4ac95d.centralindia.azurecontainerapps.io
- name: devStorageAccountName
  type: string
  default: pmdev4iwntkatliy6sst
- name: devCandidateCheckpointContainer
  type: string
  default: candidate-checkpoints-v2
- name: devRedisName
  type: string
  default: pm-dev-redis
- name: devRedisSkuName
  type: string
  default: Balanced_B0
- name: devRedisPrivateEndpointSubnetName
  type: string
  default: private-endpoints
- name: devRedisPrivateDnsZoneName
  type: string
  default: privatelink.redis.azure.net
- name: devRedisPrivateEndpointName
  type: string
  default: pm-dev-redis-pe
- name: devEntraTenantId
  type: string
  default: 723b667a-983d-46f3-9b90-a9b2580db639
- name: devEntraClientId
  type: string
  default: 4accaf35-1ae9-4e7d-999d-3f86fd7caec4
- name: devEntraApiScope
  type: string
  default: api://4accaf35-1ae9-4e7d-999d-3f86fd7caec4/Match.Read
trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - main
      - codex/*

pool:
  name: Default

stages:
- stage: Validate
  displayName: M02 quality gates
  jobs:
  - job: Repository
    displayName: Repository and security baseline
    steps:
    - checkout: self
    - bash: |
        set -euo pipefail
        test -f docs/architecture/01-system-context.md
        test -f docs/architecture/02-container.md
        test -f docs/architecture/03-components.md
        test -f docs/backlog/MVP-BACKLOG.md
        test ! -d .github/workflows
        test ! -f docker/.env
        test -f docker/.env.example
        docker compose --env-file docker/.env.example -f docker/compose.yml config --quiet
      displayName: Validate repository and Compose configuration
    - task: Cache@2
      displayName: Cache policy Python packages
      inputs:
        key: '"pip" | "$(Agent.OS)" | scripts/requirements-policy.txt'
        restoreKeys: |
          "pip" | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.cache/pip
    - bash: |
        set -euo pipefail
        python3 -m unittest discover -s scripts -p 'test_profile_simulation_feed.py' -v
        export PIP_CACHE_DIR="$(Pipeline.Workspace)/.cache/pip"
        python3 -m pip install --disable-pip-version-check -r scripts/requirements-policy.txt
        python3 -m unittest scripts.test_identity_baseline scripts.test_validate_release_identity_inputs -v
        test -f docs/backlog/STORY-WORKPACK-INDEX.md
        test -f docs/architecture/06-target-azure-hld.md
        test -f docs/architecture/07-football-analytics-detailed-lld.md
      displayName: Verify source-feed preflight and planning artifacts
  - job: Backend
    displayName: .NET 10 build and tests
    steps:
    - checkout: self
    - template: templates/validate-dotnet.yml
  - job: GateFailureProbe
    displayName: Intentional quality-gate failure probe (manual opt-in)
    condition: and(succeeded(), ${{ eq(parameters.runGateFailureProbe, true) }})
    steps:
    - checkout: self
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 10.0.x
    - bash: |
        set -euo pipefail
        dotnet test tests/PitchMind.Architecture.Tests/PitchMind.Architecture.Tests.csproj \
          -c Release --filter FullyQualifiedName~DeliberateGateFailureProbe
      env:
        PITCHMIND_GATE_FAILURE_PROBE: '1'
      displayName: Run the deliberately failing test; its nonzero exit must fail Validate
  - job: Frontend
    displayName: React build, test and lint
    steps:
    - checkout: self
    - template: templates/validate-frontend.yml
  - job: LocalInfrastructure
    displayName: PostgreSQL and Redis smoke tests
    steps:
    - checkout: self
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 10.0.x
    - bash: |
        set -euo pipefail
        chmod +x scripts/dev-*.sh
        trap './scripts/dev-down.sh' EXIT
        ./scripts/dev-up.sh
        ./scripts/dev-health.sh
        PITCHMIND_TEST_RESULTS_DIRECTORY="$(Agent.TempDirectory)/pitchmind-postgres-results" ./scripts/test-postgres.sh
      displayName: Docker Compose health and real PostgreSQL integration
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: $(Agent.TempDirectory)/pitchmind-postgres-results/postgres.trx
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
  - job: Infrastructure
    displayName: Azure Bicep static compilation
    steps:
    - checkout: self
    - template: templates/validate-infra.yml

# Only a deliberately queued parameterized run may reach these stages. The default
# validation-only main/PR pipeline CANNOT deploy. Owner approval for the exact story,
# scope, resource diff, costs, SHA and rollback is mandatory BEFORE ACR push/DEV write.
# ManualValidation and Azure DevOps Environment checks are defense in depth; their
# existence does not prove owner-only approval. The ManualValidation task can be
# resumed by users with Queue builds permission; constrain that permission and
# protected Environment approvers to the repository owner before registering delivery.
- ${{ if eq(parameters.enableDevDelivery, true) }}:
  - stage: OwnerApprovalBeforeAzureMutation
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
    - job: ValidateReleaseIdentityInputs
      steps:
      - checkout: self
      - task: Bash@3
        displayName: Require three separate release identities and reviewed network/cost inputs
        inputs:
          targetType: inline
          script: python3 scripts/validate_release_identity_inputs.py
        env:
          PITCHMIND_ACR_PUSH_SERVICE_CONNECTION: ${{ parameters.acrPushServiceConnection }}
          PITCHMIND_DEV_DEPLOY_SERVICE_CONNECTION: ${{ parameters.devDeploymentServiceConnection }}
          PITCHMIND_DEV_INFRA_SERVICE_CONNECTION: ${{ parameters.devInfrastructureServiceConnection }}
          PITCHMIND_REGISTRY_NAME: ${{ parameters.registryName }}
          PITCHMIND_IMAGE_REPOSITORY: pitchmind
          PITCHMIND_DEV_RESOURCE_GROUP: ${{ parameters.devResourceGroup }}
          PITCHMIND_DEV_APP_NAME: ${{ parameters.devAppName }}
          PITCHMIND_DEV_VNET_NAME: ${{ parameters.devVnetName }}
          PITCHMIND_DEV_ACA_SUBNET_NAME: ${{ parameters.devAcaSubnetName }}
          PITCHMIND_DEV_POSTGRES_SUBNET_NAME: ${{ parameters.devPostgresSubnetName }}
          PITCHMIND_DEV_REDIS_PE_SUBNET_NAME: ${{ parameters.devRedisPrivateEndpointSubnetName }}
          PITCHMIND_DEV_ACA_SUBNET_CIDR: ${{ parameters.devAcaSubnetCidr }}
          PITCHMIND_DEV_ESTIMATED_MONTHLY_COST: ${{ parameters.devEstimatedMonthlyCost }}
  - stage: BuildRelease
    dependsOn: OwnerApprovalBeforeAzureMutation
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
    - job: Image
      steps:
      - checkout: self
      - template: templates/build-image.yml
        parameters:
          acrPushServiceConnection: ${{ parameters.acrPushServiceConnection }}
          registryName: ${{ parameters.registryName }}
          entraTenantId: ${{ parameters.devEntraTenantId }}
          entraClientId: ${{ parameters.devEntraClientId }}
          entraApiScope: ${{ parameters.devEntraApiScope }}
          imageRepository: pitchmind
  - stage: OwnerApprovalOfReleaseDigest
    dependsOn: BuildRelease
    condition: succeeded()
    jobs:
    - job: PreviewPrivateDevTopology
      displayName: Review Azure what-if for the release digest
      steps:
      - checkout: self
      - template: templates/preview-private-dev.yml
        parameters:
          devInfrastructureServiceConnection: ${{ parameters.devInfrastructureServiceConnection }}
          registryName: ${{ parameters.registryName }}
          resourceGroup: ${{ parameters.devResourceGroup }}
          vnetName: ${{ parameters.devVnetName }}
          acaSubnetName: ${{ parameters.devAcaSubnetName }}
          acaSubnetCidr: ${{ parameters.devAcaSubnetCidr }}
          postgresSubnetName: ${{ parameters.devPostgresSubnetName }}
          postgresSubnetCidr: ${{ parameters.devPostgresSubnetCidr }}
          postgresDnsZoneName: ${{ parameters.devPostgresDnsZoneName }}
          appName: ${{ parameters.devAppName }}
          environmentName: ${{ parameters.devEnvironmentName }}
          provisionPostgres: ${{ parameters.provisionPostgres }}
          postgresServerName: ${{ parameters.devPostgresServerName }}
          postgresSkuTier: ${{ parameters.devPostgresSkuTier }}
          postgresSkuName: ${{ parameters.devPostgresSkuName }}
          postgresAdminObjectId: ${{ parameters.devPostgresAdminObjectId }}
          postgresAdminPrincipalName: ${{ parameters.devPostgresAdminPrincipalName }}
          postgresAdminPrincipalType: ${{ parameters.devPostgresAdminPrincipalType }}
          provisionRedis: ${{ parameters.provisionRedis }}
          enableCandidateFeed: ${{ parameters.enableCandidateFeed }}
          signalRName: ${{ parameters.devSignalRName }}
          signalRAllowedOrigin: ${{ parameters.devPublicAppOrigin }}
          storageAccountName: ${{ parameters.devStorageAccountName }}
          candidateCheckpointContainer: ${{ parameters.devCandidateCheckpointContainer }}
          redisName: ${{ parameters.devRedisName }}
          redisSkuName: ${{ parameters.devRedisSkuName }}
          redisPrivateEndpointSubnetName: ${{ parameters.devRedisPrivateEndpointSubnetName }}
          redisPrivateDnsZoneName: ${{ parameters.devRedisPrivateDnsZoneName }}
          redisPrivateEndpointName: ${{ parameters.devRedisPrivateEndpointName }}
          estimatedMonthlyCost: ${{ parameters.devEstimatedMonthlyCost }}
  - stage: DeployDev
    dependsOn: OwnerApprovalOfReleaseDigest
    condition: succeeded()
    jobs:
    - deployment: Dev
      environment: pitchmind-dev
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
            - template: templates/provision-private-dev.yml
              parameters:
                devInfrastructureServiceConnection: ${{ parameters.devInfrastructureServiceConnection }}
                resourceGroup: ${{ parameters.devResourceGroup }}
                registryName: ${{ parameters.registryName }}
                vnetName: ${{ parameters.devVnetName }}
                acaSubnetName: ${{ parameters.devAcaSubnetName }}
                acaSubnetCidr: ${{ parameters.devAcaSubnetCidr }}
                postgresSubnetName: ${{ parameters.devPostgresSubnetName }}
                postgresSubnetCidr: ${{ parameters.devPostgresSubnetCidr }}
                postgresDnsZoneName: ${{ parameters.devPostgresDnsZoneName }}
                appName: ${{ parameters.devAppName }}
                environmentName: ${{ parameters.devEnvironmentName }}
                provisionPostgres: ${{ parameters.provisionPostgres }}
                postgresServerName: ${{ parameters.devPostgresServerName }}
                postgresSkuTier: ${{ parameters.devPostgresSkuTier }}
                postgresSkuName: ${{ parameters.devPostgresSkuName }}
                postgresAdminObjectId: ${{ parameters.devPostgresAdminObjectId }}
                postgresAdminPrincipalName: ${{ parameters.devPostgresAdminPrincipalName }}
                postgresAdminPrincipalType: ${{ parameters.devPostgresAdminPrincipalType }}
                provisionRedis: ${{ parameters.provisionRedis }}
                enableCandidateFeed: ${{ parameters.enableCandidateFeed }}
                signalRName: ${{ parameters.devSignalRName }}
                signalRAllowedOrigin: ${{ parameters.devPublicAppOrigin }}
                storageAccountName: ${{ parameters.devStorageAccountName }}
                candidateCheckpointContainer: ${{ parameters.devCandidateCheckpointContainer }}
                redisName: ${{ parameters.devRedisName }}
                redisSkuName: ${{ parameters.devRedisSkuName }}
                redisPrivateEndpointSubnetName: ${{ parameters.devRedisPrivateEndpointSubnetName }}
                redisPrivateDnsZoneName: ${{ parameters.devRedisPrivateDnsZoneName }}
                redisPrivateEndpointName: ${{ parameters.devRedisPrivateEndpointName }}
            - template: templates/deploy-image.yml
              parameters:
                devDeploymentServiceConnection: ${{ parameters.devDeploymentServiceConnection }}
                resourceGroup: ${{ parameters.devResourceGroup }}
                appName: ${{ parameters.devAppName }}
