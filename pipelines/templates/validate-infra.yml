steps:
- bash: |
    set -euo pipefail
    az bicep version
    az bicep build --file infra/main.bicep --outfile "$(Agent.TempDirectory)/pitchmind-main.json"
    for params in infra/environments/*.bicepparam; do
      az bicep build-params --file "$params" --outfile "$(Agent.TempDirectory)/$(basename "$params").json"
    done
  displayName: Compile Bicep and environment parameters (no deployment)
