steps:
- task: UseDotNet@2
  displayName: Install .NET 10 SDK
  inputs:
    packageType: sdk
    version: 10.0.x
- task: Cache@2
  displayName: Cache NuGet packages
  inputs:
    key: '"nuget" | "$(Agent.OS)" | **/packages.lock.json'
    restoreKeys: |
      "nuget" | "$(Agent.OS)"
    path: $(Pipeline.Workspace)/.nuget/packages
- bash: |
    set -euo pipefail
    export NUGET_PACKAGES="$(Pipeline.Workspace)/.nuget/packages"
    dotnet restore PitchMind.slnx --locked-mode
    python3 scripts/check_nuget_vulnerabilities.py PitchMind.slnx
    dotnet build PitchMind.slnx --no-restore -c Release
    dotnet test PitchMind.slnx --no-build -c Release \
      --logger "trx;LogFileName=pitchmind-tests.trx" \
      --results-directory "$(Agent.TempDirectory)/pitchmind-dotnet-results"
    python3 scripts/api-contract-integration.py
  displayName: Restore, build and test solution
- task: PublishTestResults@2
  displayName: Publish .NET test results
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: $(Agent.TempDirectory)/pitchmind-dotnet-results/**/*.trx
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true
