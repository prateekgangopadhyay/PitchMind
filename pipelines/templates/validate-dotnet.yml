steps:
- task: UseDotNet@2
  displayName: Install .NET 10 SDK
  inputs:
    packageType: sdk
    version: 10.0.x
- bash: |
    set -euo pipefail
    dotnet restore PitchMind.slnx
    dotnet build PitchMind.slnx --no-restore -c Release
    dotnet test PitchMind.slnx --no-build -c Release
  displayName: Restore, build and test solution
