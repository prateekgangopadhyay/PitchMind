steps:
- task: NodeTool@0
  displayName: Install Node 22
  inputs:
    versionSpec: 22.x
- bash: |
    set -euo pipefail
    if [[ -f package-lock.json ]]; then
      npm ci
    else
      echo "WARNING: lockfile missing; using npm install. Commit package-lock.json to make CI deterministic."
      npm install --no-audit --no-fund
    fi
    npm run build
    npm test
    npm run lint
    node ../scripts/validate_operating_model.mjs
    node ../scripts/validate_operating_model.mjs --self-test
  workingDirectory: frontend
  displayName: Frontend install, build, test and lint
