steps:
- task: NodeTool@0
  displayName: Install Node 22
  inputs:
    versionSpec: 22.x
- bash: |
    set -euo pipefail
    test -f package-lock.json
    npm ci
    npm run build
    mkdir -p "$(Agent.TempDirectory)/pitchmind-frontend-results"
    npm test -- --reporter=junit --outputFile="$(Agent.TempDirectory)/pitchmind-frontend-results/results.xml"
    npm run lint
    node ../scripts/validate_operating_model.mjs
    node ../scripts/validate_operating_model.mjs --self-test
    node ../scripts/audit_simulation_feed.mjs --self-test
    node ../scripts/audit_simulation_feed.mjs
  workingDirectory: frontend
  displayName: Frontend install, build, test and lint
- task: PublishTestResults@2
  displayName: Publish frontend test results
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: JUnit
    testResultsFiles: $(Agent.TempDirectory)/pitchmind-frontend-results/*.xml
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true
