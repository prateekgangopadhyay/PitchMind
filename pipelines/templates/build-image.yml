# Publish once. Service connection must use workload identity federation.
parameters:
- name: acrPushServiceConnection
  type: string
- name: registryName
  type: string
- name: imageRepository
  type: string
  default: pitchmind
- name: entraTenantId
  type: string
- name: entraClientId
  type: string
- name: entraApiScope
  type: string
steps:
- task: AzureCLI@2
  displayName: Build immutable application image and release manifest
  env:
    PITCHMIND_REGISTRY_NAME: ${{ parameters.registryName }}
    PITCHMIND_IMAGE_REPOSITORY: ${{ parameters.imageRepository }}
  inputs:
    azureSubscription: ${{ parameters.acrPushServiceConnection }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      registry="$PITCHMIND_REGISTRY_NAME"
      repository="$PITCHMIND_IMAGE_REPOSITORY"
      tag="$(Build.SourceVersion)"
      loginServer=$(az acr show --name "$registry" --query loginServer -o tsv)
      az acr login --name "$registry" --output none
      docker build --platform linux/amd64 --file docker/Dockerfile \
        --build-arg VITE_DEPLOYMENT_VERSION="$tag" \
        --build-arg VITE_BUILD_ID="$(Build.BuildId)" \
        --build-arg VITE_AUTH_MODE=entra \
        --build-arg VITE_ENTRA_TENANT_ID='${{ parameters.entraTenantId }}' \
        --build-arg VITE_ENTRA_CLIENT_ID='${{ parameters.entraClientId }}' \
        --build-arg VITE_ENTRA_API_SCOPE='${{ parameters.entraApiScope }}' \
        --tag "$loginServer/$repository:$tag" .
      docker push "$loginServer/$repository:$tag"
      digest=$(az acr repository show --name "$registry" --image "$repository:$tag" --query digest -o tsv)
      loginServer=$(az acr show --name "$registry" --query loginServer -o tsv)
      test -n "$digest"
      mkdir -p "$(Build.ArtifactStagingDirectory)/release"
      export RELEASE_IMAGE="$loginServer/$repository@$digest" RELEASE_COMMIT="$tag"
      python3 - <<'PY'
      import json, os
      from pathlib import Path
      Path(os.environ['BUILD_ARTIFACTSTAGINGDIRECTORY'], 'release', 'manifest.json').write_text(json.dumps({'image':os.environ['RELEASE_IMAGE'],'commit':os.environ['RELEASE_COMMIT'],'buildId':os.environ['BUILD_BUILDID']}, indent=2))
      PY
- publish: $(Build.ArtifactStagingDirectory)/release
  artifact: release
  displayName: Publish immutable release manifest
